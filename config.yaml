# Automated YouTube bundle configuration
#
# Production identifiers and machine-specific paths must be supplied through
# AUTOYT__<SECTION>__<KEY> environment variables or a private local override.
# Example:
#   AUTOYT__POSTING_SCHEDULE__SPREADSHEET_ID=... \
#   AUTOYT__DRIVE__LONGFORM_CLIPS_PARENT_FOLDER_ID=... \
#   python scripts/load_config.py posting_schedule.spreadsheet_id

posting_schedule:
  spreadsheet_name: "Posting Schedule"
  spreadsheet_id: ""
  spreadsheet_url: ""
  tab_name: "Sheet1"
  required_columns:
    - "Title"
    - "Video Link"
    - "Video Type"
    - "Thumbnail Link"
    - "Posted"

source_tracking:
  spreadsheet_name: "YouTube Source Tracking"
  spreadsheet_id: ""
  spreadsheet_url: ""
  tab_name: "Sheet1"
  required_columns:
    - "Video ID"
    - "Source URL"
    - "Channel"
    - "Title"
  sources:
    - "https://www.youtube.com/@DroppingInPodcast/videos"
  candidate_limit: 50
  rotation_state_file: "source-rotation.json"

drive:
  queues_root_folder_id: ""
  source_queue_folder_id: ""
  longform_clips_parent_folder_id: ""
  shortform_clips_parent_folder_id: ""
  thumbnails_parent_folder_id: ""
  shortform_root_folder_name: "Operator Maxxing - Shortform Clips"
  longform_root_folder_name: "Operator Maxxing - Longform Clips"
  thumbnails_root_folder_name: "Operator Maxxing - Thumbnails"

youtube:
  default_category_id: "22"
  default_privacy_status: "private"
  first_clip_offset_minutes: 20
  later_clip_spacing_minutes: 60
  max_rows_per_run: 8
  time_zone: "UTC"
  thumbnail_fallback_offset_seconds: 3

paths:
  work_root: "~/.hermes/workspaces/automated-youtube"
  work_root_template: "{work_root}/{slug}"
  bundle_root: "."
  google_api_script: "google-workspace/scripts/google_api.py"
  video_use_repo: "~/Developer/video-use"
  yt_dlp_repo: "~/Developer/yt-dlp"
  yt_dlp_binary: "yt-dlp"
  ffmpeg_binary: "ffmpeg"
  ffprobe_binary: "ffprobe"

transcription:
  elevenlabs_env_file: "~/.config/automated-youtube/video-use.env"
  elevenlabs_env_key: "ELEVENLABS_API_KEY"
  google_sans_font_path: "~/.local/share/fonts/GoogleSans-Bold.ttf"
